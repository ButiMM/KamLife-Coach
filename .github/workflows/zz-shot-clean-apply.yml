name: shot-clean-apply
on:
  push:
    branches: ["cto/shot-clean"]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: cto/shot-clean
      - name: Apply current weight seam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          live = Path('server/understanding/live.ts')
          misc = Path('server/handlers/misc-commands.ts')
          routes = Path('server/routes.ts')
          tests = Path('script/tracking-contract-tests.ts')

          # Existing finalization boundary becomes the structured coaching boundary.
          s = live.read_text()
          marker = 'export async function canonicalDecision('
          assert s.count(marker) == 1, 'canonicalDecision marker count mismatch'
          if 'export type CoachingTurn = {' not in s:
              block = '''export type CoachingTurn = {\n  kind: "coach";\n  decision: "HOLD" | "REPORT_TREND";\n  facts: {\n    currentKg: number | null;\n    changeKg: number;\n    trendUsable: boolean;\n    trendWhy: string | null;\n    goal: string;\n    points: Array<{ kg: number; date: string }>;\n  };\n};\n\nfunction renderStructuredCoachingTurn(turn: CoachingTurn): string {\n  const recent = turn.facts.points.map(p =>\n    `• ${p.kg.toFixed(1)}kg — ${p.date}`,\n  ).join("\\n");\n  const history = recent ? `*Weight History*\\n\\n${recent}` : "*Weight History*";\n  if (turn.decision === "HOLD" || !turn.facts.trendUsable) {\n    const hold = turn.facts.trendWhy === "illness"\n      ? "I'm not going to call a trend off weigh-ins around your illness. Let's use clean morning weigh-ins."\n      : "I don't have enough clean weigh-ins yet to call a trend.";\n    return `${history}\\n\\n${hold}`.trim();\n  }\n  const direction = turn.facts.changeKg < 0\n    ? `Down ${Math.abs(turn.facts.changeKg).toFixed(1)}kg since you started.`\n    : turn.facts.changeKg > 0\n      ? `Up ${turn.facts.changeKg.toFixed(1)}kg since you started.`\n      : "No change since you started.";\n  return `${history}\\n\\n${direction}`.trim();\n}\n\n'''
              s = s.replace(marker, block + marker, 1)

          old = re.compile(r'export async function closeCoachingTurn\(user: any, message: string, reply: string \| null\): Promise<string> \{.*?^\}', re.S | re.M)
          matches = list(old.finditer(s))
          assert len(matches) == 1, f'closeCoachingTurn matches={len(matches)}'
          new = '''export async function closeCoachingTurn(\n  user: any,\n  message: string,\n  reply: string | CoachingTurn | null,\n): Promise<string> {\n  // Structured coaching turns already carry the decision. Never feed them back through\n  // canonicalDecision/withNextMove: that is the 16:55 second-act join.\n  if (reply && typeof reply === "object" && (reply as CoachingTurn).kind === "coach") {\n    return renderStructuredCoachingTurn(reply as CoachingTurn);\n  }\n\n  const out = String(reply ?? "");\n  const { turnMutations } = await import("../handlers/chat-log");\n  const { durableDomains } = await import("./messy-intake");\n  const { withNextMove } = await import("../reply-hygiene");\n  const wrote = durableDomains(turnMutations());\n  if (!out || wrote.length === 0) return out;\n  const decided = await canonicalDecision(user, message).catch(() => ({ todo: "" } as any));\n  const next = withNextMove(out, String(decided?.todo || ""));\n  if (next !== out) console.log(`[COACH_TURN] appended one next move after ${wrote.join("+")}`);\n  return next;\n}'''
          s = s[:matches[0].start()] + new + s[matches[0].end():]
          live.write_text(s)

          # Weight handler now returns structured facts, never the coaching paragraph.
          m = misc.read_text()
          sig_pat = re.compile(r'(export async function handleMiscCommands\([\s\S]*?\n\}\): Promise<string) \| null> \{')
          sm = sig_pat.search(m)
          assert sm, 'misc signature not found'
          m = m[:sm.start()] + sm.group(1) + ' | import("../understanding/live").CoachingTurn | null> {' + m[sm.end():]

          weight_start = m.find('      const first = logs[0].kg;')
          assert weight_start >= 0, 'weight start missing'
          weight_end = m.find('    } catch { /* fall through */ }', weight_start)
          assert weight_end > weight_start, 'weight catch boundary missing'
          replacement = '''      const first = logs[0].kg;\n      const latest = logs[logs.length - 1].kg;\n      const totalChange = latest - first;\n      const goal = user.goalType || "fat_loss";\n      const { readHealthState } = await import("../health-state");\n      const health = readHealthState(user);\n      const { weightTrendUsable } = await import("../adaptive-targets");\n      const trend = weightTrendUsable({\n        count: logs.length,\n        newestAt: new Date(logs[logs.length - 1].at).getTime(),\n        oldestAt: new Date(logs[0].at).getTime(),\n        now: Date.now(),\n        sickSince: health.sickSince ? new Date(health.sickSince).getTime() : undefined,\n        sickUntil: health.sickUntil ? new Date(health.sickUntil).getTime() : undefined,\n      });\n      return {\n        kind: "coach",\n        decision: trend.usable ? "REPORT_TREND" : "HOLD",\n        facts: {\n          currentKg: latest,\n          changeKg: totalChange,\n          trendUsable: trend.usable,\n          trendWhy: trend.usable ? null : trend.why,\n          goal,\n          points: logs.slice(-5).map(l => ({\n            kg: l.kg,\n            date: l.at.toLocaleDateString("en-ZA", { day: "numeric", month: "short" }),\n          })),\n        },\n      };\n'''
          m = m[:weight_start] + replacement + m[weight_end:]
          misc.write_text(m)

          # Existing misc route: structured coaching uses the finalization boundary; transactions retain strings.
          r = routes.read_text()
          old_route = '  const miscResult = await handleMiscCommands({ phone, message, m, user, isQuestion: normalizedQuestion, wroteThisTurn });\n  if (miscResult !== null) return miscResult;'
          assert r.count(old_route) == 1, 'misc route anchor missing'
          new_route = '''  const miscResult = await handleMiscCommands({ phone, message, m, user, isQuestion: normalizedQuestion, wroteThisTurn });\n  if (miscResult !== null) {\n    if (typeof miscResult === "object" && (miscResult as any).kind === "coach") {\n      return closeCoachingTurn(user, message, miscResult as any);\n    }\n    return miscResult;\n  }'''
          r = r.replace(old_route, new_route, 1)
          routes.write_text(r)

          # Exact 16:55 HOLD regression on the real finalization boundary.
          t = tests.read_text()
          if 'WEIGHT COACHING TURN IS TERMINAL' not in t:
              marker = '  /**\n   * LAW 3'
              assert marker in t, 'tracking LAW 3 marker missing'
              block = '''  /**\n   * WEIGHT COACHING TURN IS TERMINAL — the 16:55 HOLD cannot grow a direction/action tail.\n   */\n  {\n    const { closeCoachingTurn } = await import("../server/understanding/live");\n    const hold = {\n      kind: "coach" as const,\n      decision: "HOLD" as const,\n      facts: {\n        currentKg: 85.75, changeKg: 1.2, trendUsable: false, trendWhy: "illness", goal: "muscle_gain",\n        points: [{ kg: 85.75, date: "28 Aug" }],\n      },\n    };\n    const out = await closeCoachingTurn({}, "what is my weight trend", hold);\n    if (/going up|going down|keep fuelling|trend is/i.test(out)) {\n      failures.push(`16:55 HOLD leaked direction/action: ${out}`);\n    }\n    if ((out.match(/\\n\\n/g) || []).length > 1) {\n      failures.push(`HOLD rendered more than one act: ${out}`);\n    }\n  }\n\n'''
              t = t.replace(marker, block + marker, 1)
          tests.write_text(t)

          assert 'return {\n        kind: "coach"' in misc.read_text(), 'structured weight return missing'
          assert 'reply: string | CoachingTurn | null' in live.read_text(), 'structured close signature missing'
          assert 'typeof miscResult === "object"' in routes.read_text(), 'structured route seam missing'
          print('CURRENT_WEIGHT_SEAM_OK')
          PY
          git diff --check
          git add server/understanding/live.ts server/handlers/misc-commands.ts server/routes.ts script/tracking-contract-tests.ts
          git diff --cached --check
          git config user.name 'cto-builder'
          git config user.email 'cto-builder@users.noreply.github.com'
          git commit -m 'fix: make weight coaching a structured terminal turn'
          git rm -f .github/workflows/zz-shot-clean-apply.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:cto/shot-clean
