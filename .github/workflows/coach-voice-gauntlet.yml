name: Coach Voice Gauntlet (live model)

# THE TIER NO STUB CAN GRADE (2026-08-06, founder directive: "schedule the real-model gauntlet
# on a cadence against real traffic — not on demand, and not on your phone alone").
#
# The offline gauntlet proves ROUTING and SHAPE with no network: is it one message, two
# sentences, whose numbers, is there a receipt. What it cannot judge is whether the model's
# WORDS are any good — so those cases declare `needsLLM` and are skipped OUT LOUD, which is
# honest but useless if nobody ever runs the other tier.
#
# This is the other tier. It runs the same file with GAUNTLET_LLM=1, so the five real exchanges
# from the founder's phone — the taxi-rank question, calories-left, "coach me", the grocery
# paragraph, the Zulu-English mix — are graded against the live model every morning instead of
# being caught by hand in production a week later.
#
# Daily at 04:00 SAST: after the model drill (03:00 UTC / 05:00 SAST is the drill; this runs
# before it at 02:00 UTC) and well clear of the routing suite, so a red build names one cause.
# Costs real tokens, so it is never on push.

on:
  schedule:
    - cron: "0 2 * * *" # 04:00 SAST daily
  workflow_dispatch: {}

concurrency:
  group: coach-voice-gauntlet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
      # The engine is the thing being graded, so it must be on — the same as production.
      ENGINE_LIVE: "on"
      GAUNTLET_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # FAIL LOUD, NEVER SKIP GREEN (2026-08-06). The first scheduled run went red at 04:19 and
      # the result died here where nobody looks — which is exactly the failure this workflow
      # exists to end. A judge whose verdict reaches no one is not a judge.
      - name: Run the gauntlet against the live model
        id: gauntlet
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not set, so the coach's WORDS are being graded by nobody."
            echo "Add it in Settings → Secrets and variables → Actions. Failing on purpose: a silent"
            echo "skip here is how the founder ends up being the test suite."
            exit 1
          fi
          set -o pipefail
          npx tsx script/gauntlet.ts 2>&1 | tee gauntlet.log

      # The scores reach a human. Written into the run summary so the verdict is readable
      # without opening logs, and sent to the founder's phone when an alert number is set.
      - name: Report the verdict
        if: always()
        run: |
          {
            echo "## Coach voice — live model"
            echo '```'
            tail -40 gauntlet.log 2>/dev/null || echo "no output — the run died before grading"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tell the founder when the coach voice goes red
        if: failure() && env.TWILIO_ACCOUNT_SID != ''
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_SMS_NUMBER: ${{ secrets.TWILIO_SMS_NUMBER }}
          COACH_ALERT_PHONE: ${{ secrets.COACH_ALERT_PHONE }}
        run: |
          if [ -z "$COACH_ALERT_PHONE" ]; then exit 0; fi
          BODY="[COACH VOICE] The live-model gauntlet went RED this morning. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_ACCOUNT_SID/Messages.json" \
            --data-urlencode "To=+${COACH_ALERT_PHONE}" \
            --data-urlencode "From=${TWILIO_SMS_NUMBER}" \
            --data-urlencode "Body=${BODY}" \
            -u "$TWILIO_ACCOUNT_SID:$TWILIO_AUTH_TOKEN" > /dev/null || true
