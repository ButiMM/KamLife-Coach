name: cto-watch
on:
  schedule:
    - cron: "*/15 * * * *"
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read
concurrency:
  group: cto-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/QUEUE.md
            script
            server
      - run: python3 script/cto-watch.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
