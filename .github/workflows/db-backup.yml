name: Database Backup

# Backs up the Railway Postgres database to Cloudflare R2 every 6 hours.
# Runs independently of the app container, so it works even if the app is down.
# Setup + restore instructions: docs/backup-restore.md
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  - PUBLIC Postgres connection string (the *.proxy.rlwy.net
#                          one from Railway, NOT the *.railway.internal URL)
#   R2_ACCESS_KEY_ID     - Cloudflare R2 API token access key id
#   R2_SECRET_ACCESS_KEY - Cloudflare R2 API token secret
#   R2_BUCKET            - R2 bucket name (e.g. kamlife-db-backups)
#   R2_ENDPOINT          - https://<account-id>.r2.cloudflarestorage.com

on:
  schedule:
    - cron: "17 */6 * * *" # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch: {} # lets you trigger a backup manually from the Actions tab

concurrency:
  group: db-backup
  cancel-in-progress: false

# #342: a failed backup opens a GitHub issue (the phone alert needs secrets that aren't set).
permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # #342: every backup is restored into this throwaway database before it counts as good.
    services:
      restore:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # aws-cli (preinstalled on the runner) talks to R2 via these.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      RETENTION_DAYS: "30"
    steps:
      - name: Guard — required secrets present
        id: guard
        run: |
          set -euo pipefail
          missing=""
          for v in DATABASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_BUCKET R2_ENDPOINT; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Backup SKIPPED — missing GitHub secrets:$missing"
            echo "::warning::Go to repo Settings → Secrets and variables → Actions and add the 5 secrets listed at the top of db-backup.yml"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # On manual trigger, fail hard so the operator knows setup is incomplete
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Manually triggered but secrets not configured:$missing"
              exit 1
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install postgresql-client 18
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # ubuntu-latest ships an OLDER pg_dump on PATH already (16.x) — installing v18
          # does not override it (2026-07-08: apt install succeeded, but `pg_dump
          # --version` still printed 16.14 and the dump step failed on the same version
          # mismatch). Prepend the versioned bin dir to PATH for every later step so the
          # v18 binary is the one actually invoked, not just installed.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      # #499: every erased account id (ids only, nothing personal) goes to R2 on every run, into files
      # the backup prune never touches, so a restore can re-apply deletions even after the live database
      # and the app's logs are gone. Runs before the dump and even when the dump later fails.
      # A tombstone lives exactly as long as a backup that predates it: ids erased since the day before
      # the oldest backup in daily/. If that cannot be read, every id is kept (never fewer).
      - name: Save erasure tombstones
        id: tombstones
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          OLDEST=$( (aws s3 ls "s3://${R2_BUCKET}/daily/" --endpoint-url "$R2_ENDPOINT" || true) | awk '{print $4}' | sed -n 's/^kamlife-\([0-9]\{8\}\)-.*/\1/p' | sort | head -1)
          SINCE=$([ -n "$OLDEST" ] && date -u -d "$OLDEST -1 day" +%Y-%m-%d || echo 1970-01-01)
          T="erased-$(date -u +%Y%m%d-%H%M%S).txt"
          psql -tA -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "SELECT meta->>'userId' FROM admin_events WHERE action = 'account_erased' AND created_at >= '${SINCE}' ORDER BY created_at" > "/tmp/${T}"
          aws s3 cp "/tmp/${T}" "s3://${R2_BUCKET}/tombstones/${T}" --endpoint-url "$R2_ENDPOINT"
          echo "Saved $(wc -l < "/tmp/${T}") erased ids to tombstones/${T}"

      - name: Dump + compress
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          FILE="kamlife-${STAMP}.sql.gz"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          # --no-owner/--no-privileges so the dump restores cleanly under any role.
          pg_dump --no-owner --no-privileges "$DATABASE_URL" | gzip -9 > "/tmp/${FILE}"
          SIZE=$(stat -c%s "/tmp/${FILE}")
          echo "Dump size: ${SIZE} bytes"
          # A real dump of this schema is never this small — guard against silent empty backups.
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Dump suspiciously small (${SIZE} bytes) — treating as failed"
            exit 1
          fi

      - name: Test-restore the backup just made, before it is published (#342)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          RESTORE_URL="postgresql://postgres:restore@127.0.0.1:5433/restore"
          # Strict: any failed statement fails the restore, so a partial dump can't pass (#494 attack).
          if ! gunzip -c "/tmp/${FILE}" | psql -q -v ON_ERROR_STOP=1 --single-transaction "$RESTORE_URL" > /dev/null 2> /tmp/restore.err; then
            echo "::error::Backup ${FILE} did not restore cleanly"; tail -20 /tmp/restore.err
            aws s3 cp "/tmp/${FILE}" "s3://${R2_BUCKET}/failed/${FILE}" --endpoint-url "$R2_ENDPOINT" || true
            exit 1
          fi
          CLIENTS=$(psql -tA "$RESTORE_URL" -c "SELECT count(*) FROM users")
          MEALS=$(psql -tA "$RESTORE_URL" -c "SELECT count(*) FROM meal_logs")
          echo "Restored: ${CLIENTS} clients, ${MEALS} meal rows"
          if [ "${CLIENTS:-0}" -lt 1 ]; then
            echo "::error::Backup ${FILE} restored with no clients"
            aws s3 cp "/tmp/${FILE}" "s3://${R2_BUCKET}/failed/${FILE}" --endpoint-url "$R2_ENDPOINT" || true
            exit 1
          fi

      - name: Publish to R2 (only a backup that restored)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          aws s3 cp "/tmp/${FILE}" "s3://${R2_BUCKET}/daily/${FILE}" --endpoint-url "$R2_ENDPOINT"
          echo "Uploaded s3://${R2_BUCKET}/daily/${FILE}"

      - name: Prune backups older than retention window
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true # backup already succeeded; pruning is best-effort
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "-${RETENTION_DAYS} days" +%Y%m%d)
          echo "Deleting daily backups dated before ${CUTOFF}"
          aws s3 ls "s3://${R2_BUCKET}/daily/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $4}' | while read -r key; do
              [ -z "$key" ] && continue
              d=$(echo "$key" | sed -n 's/^kamlife-\([0-9]\{8\}\)-.*/\1/p')
              if [ -n "$d" ] && [ "$d" -lt "$CUTOFF" ]; then
                echo "  pruning $key"
                aws s3 rm "s3://${R2_BUCKET}/daily/${key}" --endpoint-url "$R2_ENDPOINT"
              fi
            done

      # #499 attack: an erased id is kept only while a backup that could bring the account back exists.
      # Runs after the backup prune; with no readable backup list it deletes nothing. Not best-effort:
      # a failure fails the run and opens the alert issue.
      - name: Prune tombstones no backup still needs
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          OLDEST=$(aws s3 ls "s3://${R2_BUCKET}/daily/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | sed -n 's/^kamlife-\([0-9]\{8\}\)-.*/\1/p' | sort | head -1)
          if [ -z "$OLDEST" ]; then echo "No backups listed; keeping every tombstone"; exit 0; fi
          SINCE=$(date -u -d "$OLDEST -1 day" +%Y%m%d)
          (aws s3 ls "s3://${R2_BUCKET}/tombstones/" --endpoint-url "$R2_ENDPOINT" || true) | awk '{print $4}' | while read -r key; do
            d=$(echo "$key" | sed -n 's/^erased-\([0-9]\{8\}\)-.*/\1/p')
            if [ -n "$d" ] && [ "$d" -lt "$SINCE" ]; then aws s3 rm "s3://${R2_BUCKET}/tombstones/${key}" --endpoint-url "$R2_ENDPOINT"; fi
          done
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "DELETE FROM admin_events WHERE action = 'account_erased' AND created_at < '$(date -u -d "$SINCE" +%Y-%m-%d)'"

      - name: Fail the run if the tombstones were not saved (#499)
        if: steps.guard.outputs.skip != 'true' && steps.tombstones.outcome == 'failure'
        run: |
          echo "::error::Erasure tombstones were not saved to R2"; exit 1

      - name: Summary
        if: steps.guard.outputs.skip != 'true'
        run: echo "Backup complete — daily/${FILE} on R2 (retention ${RETENTION_DAYS}d)"

      - name: Alert the founder when a backup fails (#342)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Database backup failed"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          OPEN=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --repo "${{ github.repository }}" --body "Failed again: $RUN"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "The 6-hourly database backup (or its test-restore) failed: $RUN. Founder: check the R2 and BACKUP_DATABASE_URL secrets and re-run the workflow. See docs/backup-restore.md."
          fi
