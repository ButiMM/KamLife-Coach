name: CTO apply next
on:
  push:
    branches: ["cto/one-shot-final"]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[cto-next]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: cto/one-shot-final, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Apply
        run: node scripts/cto-apply-next.mjs
      - name: Commit
        run: |
          git config user.name "cto-builder"
          git config user.email "cto-builder@users.noreply.github.com"
          git add server/gpt.ts server/handlers/misc-commands.ts script/tracking-contract-tests.ts
          git commit -m "fix: converge re-entry and material protein priority [cto-next]" || true
          git push origin cto/one-shot-final
