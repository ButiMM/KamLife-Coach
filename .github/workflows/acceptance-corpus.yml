name: acceptance-corpus

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Phase 1 messy-life corpus
        run: npx --yes tsx script/check-acceptance-corpus.ts
