name: Customer replay gate

# #270, docs/ORDERS.md §4 Step 2. Real failures replayed through the production-shaped path —
# real PostgreSQL, the live model, ENGINE_LIVE=on, the live normaliser — and graded on stored rows
# and the post-transport WhatsApp body. The judge is an OpenAI model.
#
# BASELINE ON MAIN, EVERY RUN: the same gate, corpus and judge run first on the base branch's product
# code, and that run is the baseline. A hard invariant (ORDERS §3) that passes on main and fails on
# this PR fails the job. A check that already fails on main is reported, not blocking.
#
# No key, no verdict: without the OpenAI secret the gate exits 2 and this job is RED, never green.

# COST FIREWALL (CTO, 24 Sep): the live-model gate ran on every push of every PR, including docs-only
# PRs, and emptied the OpenAI credits. It now runs only when a PR is labelled `ready`, `switch` or `gate`,
# and never for docs-only changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/cto-watch.yml"
      - ".github/workflows/mouth-ratchet.yml"
      - "script/cto-watch.py"
      - "script/mouth-count.py"
  workflow_dispatch: {}

concurrency:
  group: replay-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # every job below only runs for ready / switch / gate PRs (or a manual run)
  replay:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ready') || contains(github.event.pull_request.labels.*.name, 'switch') || contains(github.event.pull_request.labels.*.name, 'gate')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kam
          POSTGRES_PASSWORD: kam
          POSTGRES_DB: kamlife
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://kam:kam@127.0.0.1:5432/kamlife
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.AI_INTEGRATIONS_OPENAI_API_KEY }}  # the key the founder set for the judge first
      REPLAY_HELDOUT_JSON: ${{ secrets.REPLAY_HELDOUT_JSON }}
      PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply committed migrations to the ephemeral database
        run: npm run db:migrate
      - name: Record the baseline — this gate on the base branch's product code
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git worktree add "$RUNNER_TEMP/base" FETCH_HEAD
          # THE BASELINE'S CHECKS COME FROM MAIN (Codex @ 8e19105). Main's own gate and corpus grade
          # main's product, so a PR that deletes or weakens a hard check finds it in the baseline and
          # missing from its own run: a regression, never a quiet green. The PR's copy is used only
          # while main has no gate at all (the PR that introduces it).
          if [ ! -f "$RUNNER_TEMP/base/script/replay-gate.ts" ]; then
            cp script/replay-gate.ts script/replay-cases.ts script/replay-heldout.json "$RUNNER_TEMP/base/script/"
          fi
          PGPASSWORD=kam psql -h 127.0.0.1 -U kam -d kamlife -c "CREATE DATABASE kamlife_base"
          cd "$RUNNER_TEMP/base"
          npm ci --no-audit --no-fund
          DATABASE_URL=postgres://kam:kam@127.0.0.1:5432/kamlife_base npm run db:migrate
          DATABASE_URL=postgres://kam:kam@127.0.0.1:5432/kamlife_base REPLAY_BASELINE_PATH="$RUNNER_TEMP/base-baseline.json" \
            npx tsx script/replay-gate.ts --write-baseline
          mkdir -p "$GITHUB_WORKSPACE/replay-results"
          cp "$RUNNER_TEMP/base-baseline.json" "$GITHUB_WORKSPACE/replay-results/baseline-${BASE_REF}.json"
          cp replay-results/*.json "$GITHUB_WORKSPACE/replay-results/" 2>/dev/null || true
      - name: Replay the corpus on this PR and grade it against the baseline
        run: REPLAY_BASELINE_PATH="$RUNNER_TEMP/base-baseline.json" npx tsx script/replay-gate.ts
      - name: Keep the run record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: replay-results
          path: replay-results/
