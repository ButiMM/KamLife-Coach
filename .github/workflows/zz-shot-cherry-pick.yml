name: shot-apply-patch
on:
  push:
    branches: ["cto/shot-implementation"]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cto/shot-implementation
      - name: Apply exact commit patch
        run: |
          set -euo pipefail
          git config user.name 'cto-builder'
          git config user.email 'cto-builder@users.noreply.github.com'
          git show --format= --binary d2cfeb1cd771bdb6c3c25916a417b9b8956d7b76 > /tmp/weight.patch
          git apply --3way /tmp/weight.patch
          git rm -f .github/workflows/zz-shot-cherry-pick.yml || true
          git add -A
          git diff --cached --check
          git commit -m 'fix: make weight coaching a structured terminal turn'
          git push origin HEAD:cto/shot-implementation