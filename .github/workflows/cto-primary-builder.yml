name: CTO primary-builder integration

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Patch existing owners
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("server/memory.ts")
          s = p.read_text()
          if 'from "./understanding/day-relative-situation"' not in s:
              s = s.replace(
                  'import { sastDaysBetween } from "./sast";\n',
                  'import { sastDaysBetween } from "./sast";\nimport { resolveRecentSituation } from "./understanding/day-relative-situation";\n', 1,
              )
          helper = r'''
function situationLineForResolved(resolved: { kind: string; moment: string }): string {
  if (resolved.kind === "celebration_outing") return "CURRENT SITUATION: Client has a celebration outing around the referenced day; restaurant eating is expected.";
  if (resolved.kind === "eating_out") return "CURRENT SITUATION: Client expects to eat out around the referenced day.";
  if (resolved.kind === "food_closed") return "CURRENT SITUATION: Client has closed food for the referenced day.";
  return "";
}
'''
          if 'function situationLineForResolved' not in s:
              s = s.replace('export function extractSalientSituation(clientMessages: string[]): string {', helper + '\nexport function extractSalientSituation(clientMessages: string[]): string {', 1)
          s, n = re.subn(
              r'export function extractSalientSituation\(clientMessages: string\[\]\): string \{.*?\n\}\n\nfunction foodDayClosedIn',
              '''export function extractSalientSituation(clientMessages: string[]): string {\n  const stamped = (clientMessages || []).map(text => ({ text: String(text || "").trim(), at: new Date() })).filter(x => x.text);\n  return situationLineForResolved(resolveRecentSituation(stamped));\n}\n\nfunction foodDayClosedIn''',
              s, count=1, flags=re.S,
          )
          assert n == 1
          s, n = re.subn(
              r'export async function loadSalientSituation\(phone: string, currentMessage\?: string\): Promise<string> \{.*?\n\}\n\nexport async function loadSituationFrame',
              '''export async function loadSalientSituation(phone: string, currentMessage?: string): Promise<string> {\n  const stamped = await recentClientMessagesStamped(phone);\n  if (currentMessage) stamped.unshift({ text: currentMessage, at: new Date() });\n  return situationLineForResolved(resolveRecentSituation(stamped));\n}\n\nexport async function loadSituationFrame''',
              s, count=1, flags=re.S,
          )
          assert n == 1
          s, n = re.subn(
              r'export async function loadSituationFrame\(phone: string, currentMessage\?: string\): Promise<string> \{.*?\n\}\n\nexport async function recentClientMessagesStamped',
              '''export async function loadSituationFrame(phone: string, currentMessage?: string): Promise<string> {\n  const stamped = await recentClientMessagesStamped(phone);\n  if (currentMessage) stamped.unshift({ text: currentMessage, at: new Date() });\n  const resolved = resolveRecentSituation(stamped);\n  if (!resolved.kind || resolved.moment === "stale") return "";\n  return frameSituationForClient(situationLineForResolved(resolved), resolved.moment as any);\n}\n\nexport async function recentClientMessagesStamped''',
              s, count=1, flags=re.S,
          )
          assert n == 1
          p.write_text(s)

          p = Path("server/handlers/misc-commands.ts")
          s = p.read_text()
          if 'from "../understanding/current-date"' not in s:
              s = s.replace(
                  'import { daysOnProgramme } from "../day-ledger-core";\n',
                  'import { daysOnProgramme } from "../day-ledger-core";\nimport { currentDateAnswer, isCurrentDateQuestion } from "../understanding/current-date";\n', 1,
              )
          needle = '  const { phone, message, m, user, wroteThisTurn } = ctx;\n'
          insert = needle + '\n  if (isCurrentDateQuestion(message)) {\n    const reply = currentDateAnswer();\n    await logChat(user.id, message, reply, "CURRENT_DATE");\n    return reply;\n  }\n'
          assert needle in s
          if 'isCurrentDateQuestion(message)' not in s:
              s = s.replace(needle, insert, 1)
          p.write_text(s)

          p = Path("server/routes.ts")
          s = p.read_text()
          needle = '  const miscResult = await handleMiscCommands({ phone, message, m, user, isQuestion: normalizedQuestion, wroteThisTurn });\n'
          insert = r'''  if (/^(?:and|what about|how about)\s+(?:the\s+)?steps\s*\?$/i.test(m.trim())) {
    const [todayStep] = await db.select({ steps: stepLogs.steps })
      .from(stepLogs)
      .where(and(eq(stepLogs.userId, user.id), gte(stepLogs.loggedAt, sastDayStart())))
      .orderBy(desc(stepLogs.loggedAt))
      .limit(1);
    const steps = Number(todayStep?.steps || 0);
    const target = Number(user.stepsTarget) || 8500;
    turnEvidence({ stepsToday: steps });
    const name = getDisplayName(user) || "there";
    const reply = !steps
      ? `${name} — nothing logged yet today. Your target is ${target.toLocaleString()} steps.`
      : steps >= target
        ? `${name} — ${steps.toLocaleString()} steps today. Target hit ✅`
        : `${name} — ${steps.toLocaleString()} steps so far. ${Math.max(0, target - steps).toLocaleString()} to hit your target.`;
    await logChat(user.id, message, reply, "STEP_FOLLOW_UP");
    return reply;
  }

''' + needle
          assert needle in s
          if 'STEP_FOLLOW_UP' not in s:
              s = s.replace(needle, insert, 1)
          p.write_text(s)

          p = Path("server/unlogged-notice.ts")
          s = p.read_text()
          old = '''export function carriesFeelingClause(text: string): boolean {\n  return /\\b(i feel|i'm feeling|im feeling|i felt|feel like|feeling like|i think i|ruined|failed|guilty|ashamed|disappointed|gave up|giving up|fell off|messed up|stressing me|so stressed|really stressed|depressed|anxious|can'?t cope)\\b/i.test(text || "");\n}\n'''
          new = '''export function carriesFeelingClause(text: string): boolean {\n  const raw = String(text || "");\n  if (/\\b(?:i think i(?:'m| am) going to|i(?:'m| am) going to|i'?ll|i will)\\b/i.test(raw)) return false;\n  return /\\b(i feel|i'm feeling|im feeling|i felt|feel like|feeling like|i think i|ruined|failed|guilty|ashamed|disappointed|gave up|giving up|fell off|messed up|stressing me|so stressed|really stressed|depressed|anxious|can'?t cope)\\b/i.test(raw);\n}\n'''
          assert old in s
          if 'const raw = String(text || "");' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("server/handlers/gpt-block.ts")
          s = p.read_text()
          old = 'const decision = await canonicalDecision(user, message).catch(() => ({ todo: "", kind: "hold" }));'
          new = 'const decision = await canonicalDecision(user, message).catch(() => ({ todo: "", kind: "hold", reply: "" }));'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))

          p = Path("script/coach-loop-foundation-tests.ts")
          s = p.read_text()
          if 'carriesFeelingClause' not in s:
              s = s.replace(
                  'import { morningClosingLine, composeMorning } from "../server/morning-message";\n',
                  'import { morningClosingLine, composeMorning } from "../server/morning-message";\nimport { carriesFeelingClause } from "../server/unlogged-notice";\n', 1,
              )
              s = s.replace(
                  '  console.log("coach-loop-foundation: all checks passed");\n',
                  '  assert.equal(carriesFeelingClause("I think I\'m going to stop eating today"), false);\n  assert.equal(carriesFeelingClause("I feel overwhelmed today"), true);\n\n  console.log("coach-loop-foundation: all checks passed");\n', 1,
              )
          p.write_text(s)

          Path(".github/workflows/cto-primary-builder.yml").unlink()

      - name: Validate focused slice
        run: |
          npx tsx script/reaction-guard-tests.ts
          npx tsx script/current-date-tests.ts
          npx tsx script/day-relative-situation-tests.ts
          npx tsx script/coach-loop-foundation-tests.ts
          npx tsc --noEmit
          git diff --check

      - name: Commit integrated slice back to builder branch
        run: |
          git config user.name "KamLife CTO Builder"
          git config user.email "cto-builder@kamlife.local"
          git add server/memory.ts server/handlers/misc-commands.ts server/routes.ts server/unlogged-notice.ts server/handlers/gpt-block.ts script/coach-loop-foundation-tests.ts .github/workflows/cto-primary-builder.yml
          git commit -m "Coach loop: integrate continuity owners"
          git push origin HEAD:${GITHUB_HEAD_REF}
