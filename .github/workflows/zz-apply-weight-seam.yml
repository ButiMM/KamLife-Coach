name: apply-weight-seam
on:
  push:
    branches: ["cto/one-shot-final"]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cto/one-shot-final
      - uses: actions/setup-python@v5
      - name: Apply weight seam
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          live=Path('server/understanding/live.ts'); ls=live.read_text()
          if 'export type CoachingTurn' not in ls: raise SystemExit('CoachingTurn missing')
          if 'export function composeCoachingTurn' not in ls: raise SystemExit('composer missing')
          misc=Path('server/handlers/misc-commands.ts'); s=misc.read_text()
          if 'decision: trend.usable ? "REPORT_TREND" : "HOLD"' not in s:
              p=re.compile(r'(?P<i>\s*)const name2 = user\.name\?\.split\(" "\)\[0\] \|\| "";\n\s*return `\*\$\{name2 \? name2 \+ "\'s " : ""\}Weight History\*.*?`\.trim\(\);',re.S)
              m=p.search(s)
              if not m: raise SystemExit('weight return not found')
              i=m.group('i')
              old=m.group(0)
              # Preserve all preceding declarations; replace only the final prose return block.
              rep=(i+'return {\n'+i+'  kind: "coach",\n'+i+'  decision: trend.usable ? "REPORT_TREND" : "HOLD",\n'+i+'  facts: {\n'+i+'    currentKg: logs[logs.length - 1]?.kg ?? null,\n'+i+'    changeKg: totalChange,\n'+i+'    trendUsable: trend.usable,\n'+i+'    trendWhy: trend.usable ? null : trend.why,\n'+i+'    goal,\n'+i+'    points: logs.slice(-5).map(l => ({\n'+i+'      kg: l.kg,\n'+i+'      date: l.at.toLocaleDateString("en-ZA", { day: "numeric", month: "short" }),\n'+i+'    })),\n'+i+'  },\n'+i+'};')
              s=s[:m.start()]+rep+s[m.end():]
              misc.write_text(s)
          routes=Path('server/routes.ts'); r=routes.read_text()
          if 'composeCoachingTurn(miscResult' not in r:
              a=r.find('  const miscResult = await handleMiscCommands({')
              b=r.find('  const lifecycleResult = await handleLifecycle',a)
              if a<0 or b<0: raise SystemExit('route misc block not found')
              r=r[:a]+'''  const miscResult = await handleMiscCommands({ phone, message, m, user, isQuestion: normalizedQuestion, wroteThisTurn });\n  if (miscResult !== null) {\n    if (typeof miscResult === "object" && (miscResult as any).kind === "coach") {\n      const { composeCoachingTurn } = await import("./understanding/live");\n      return composeCoachingTurn(miscResult as any);\n    }\n    return miscResult;\n  }\n\n'''+r[b:]
              routes.write_text(r)
          tests=Path('script/tracking-contract-tests.ts'); t=tests.read_text()
          if 'WEIGHT COACHING TURN IS TERMINAL' not in t:
              marker='  /**\n   * LAW 3 — THE ANSWER MUST QUOTE THE LEDGER'
              p=t.find(marker)
              if p<0: raise SystemExit('test marker missing')
              block='''  /**\n   * WEIGHT COACHING TURN IS TERMINAL — HOLD cannot grow a direction/action tail.\n   */\n  {\n    const { composeCoachingTurn } = await import("../server/understanding/live");\n    const hold = composeCoachingTurn({\n      kind: "coach", decision: "HOLD",\n      facts: { currentKg: 85.75, changeKg: 1.2, trendUsable: false, trendWhy: "illness", goal: "muscle_gain",\n        points: [{ kg: 85.75, date: "28 Aug" }] },\n    });\n    if (/going up|going down|keep fuelling|trend is/i.test(hold)) failures.push("HOLD leaked direction/action: " + hold);\n  }\n\n'''
              tests.write_text(t[:p]+block+t[p:])
          subprocess.run(['git','rm','-f','.github/workflows/zz-apply-weight-seam.yml'],check=True)
          subprocess.run(['git','add','server/understanding/live.ts','server/handlers/misc-commands.ts','server/routes.ts','script/tracking-contract-tests.ts'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','cto-builder'],check=True)
          subprocess.run(['git','config','user.email','cto-builder@users.noreply.github.com'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              raise SystemExit('no product diff produced')
          subprocess.run(['git','commit','-m','fix: make weight coaching a structured terminal turn'],check=True)
          subprocess.run(['git','push','origin','HEAD:cto/one-shot-final'],check=True)
          PY