name: p0-repair-verified

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply surgical P0 consolidation, verifier wiring, and regex-budget repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          meaning = Path('server/understanding/meaning-engine.ts')
          s = meaning.read_text()
          s = s.replace('verifyBrainReply(finalReply, { goalType: user?.goalType })','verifyBrainReply(finalReply, { goalType: user?.goalType, clientMessage: message })',1)
          s = s.replace('verifyBrainReply(rewritten, { goalType: user?.goalType })','verifyBrainReply(rewritten, { goalType: user?.goalType, clientMessage: message })',1)
          s = s.replace('import { deriveRuntimeDecision, type RuntimeDecisionResult } from "./decision-runtime";','import { deriveRuntimeDecision, type RuntimeDecisionResult } from "./state";',1)
          meaning.write_text(s)

          for path in ['script/decision-state-tests.ts','script/decision-runtime-tests.ts']:
              p=Path(path); t=p.read_text(); t=t.replace('from "../server/understanding/decision-state"','from "../server/understanding/state"').replace('from "../server/understanding/decision-runtime"','from "../server/understanding/state"'); p.write_text(t)
          for p in [Path('server/understanding/decision-state.ts'),Path('server/understanding/decision-runtime.ts')]:
              if p.exists(): p.unlink()

          rv=Path('server/brain/reply-verifier.ts'); s=rv.read_text()
          existing={'FORBIDDEN_ACTION_RE','CLAIMED_GOAL_CHANGE_RE','FAT_LOSS_PUSH_RE','SURPLUS_PUSH_RE','FITNESS_MYTH_RE','MYTH_DEBUNK_RE','PROGRAMME_FREELANCE_RE','MEDICAL_CURE_RE','MEDICATION_TIMING_RE','MEDICATION_CHANGE_RE'}
          out=[]
          for line in s.splitlines():
              stripped=line.strip()
              if stripped.startswith('const ') and ' = /' in stripped and stripped.split()[1] in existing:
                  name=stripped.split()[1]; rhs=stripped.split(' = ',1)[1]; rhs=rhs[:-1] if rhs.endswith(';') else rhs
                  out += [f'const {name} =',f'  {rhs}',';']
              else: out.append(line)
          s='\n'.join(out)+'\n'
          start=s.find('const STEP_QUERY_RE =')
          if start>=0:
              end=s.find('export function verifyBrainReply',start)
              replacement='''const STEP_NUMBER_RE = /\\b(?:step(?:s)?|walk(?:ed|ing)?)\\b[^0-9]{0,16}(\\d[\\d ,]*)\\b|\\b(\\d[\\d ,]*)\\b[^a-z0-9]{0,8}(?:step(?:s)?|walk(?:ed|ing)?)\\b/i;\n\nfunction extractStepNumbers(text: string): number[] {\n  const out: number[] = [];\n  const m = (text || "").match(STEP_NUMBER_RE);\n  if (!m) return out;\n  for (const raw of [m[1], m[2]]) {\n    if (!raw) continue;\n    const normalized = raw.split(",").join("").split(" ").join("");\n    const n = Number(normalized);\n    if (Number.isFinite(n)) out.push(n);\n  }\n  return [...new Set(out)];\n}\n\nfunction isExplicitStepQuery(text: string): boolean {\n  const q = (text || "").toLowerCase();\n  return q.includes("step") && (q.includes("how") || q.includes("what") || q.includes("did i") || q.includes("have i") || q.includes("my steps"));\n}\n\nfunction verifyStepAttribution(reply: string, clientMessage: string): VerifierResult {\n  const replySteps = extractStepNumbers(reply);\n  if (replySteps.length === 0) return { ok: true };\n  if (isExplicitStepQuery(clientMessage)) return { ok: true };\n  const reported = extractStepNumbers(clientMessage);\n  if (reported.length === 0) return { ok: false, violation: "Your reply attributes a step/walking number to the client, but their current message did not report a step count. Stored snapshot state is not a current-turn client statement." };\n  if (replySteps.some(n => !reported.includes(n))) return { ok: false, violation: "Your reply attributes a step count that is not one of the numbers the client reported in this message." };\n  return { ok: true };\n}\n\n'''
              s=s[:start]+replacement+s[end:]
          rv.write_text(s)

          unit=Path('script/unit-tests.ts'); s=unit.read_text()
          s=s.replace('assert.match(eng, /verifyBrainReply\\(finalReply, \\{ goalType: user\\?\\.goalType \\}\\)/, "engine verifies the freeform reply");','assert.match(eng, /verifyBrainReply\\(finalReply, \\{ goalType: user\\?\\.goalType, clientMessage: message \\}\\)/, "engine verifies the freeform reply");',1)
          s=s.replace('assert.match(eng, /verifyBrainReply\\(rewritten, \\{ goalType: user\\?\\.goalType \\}\\)\\.ok/, "a rewrite is re-verified before it can be sent");','assert.match(eng, /verifyBrainReply\\(rewritten, \\{ goalType: user\\?\\.goalType, clientMessage: message \\}\\)\\.ok/, "a rewrite is re-verified before it can be sent");',1)
          unit.write_text(s)
          PY
      - name: Verify typecheck and P0/full suite
        run: npm ci && npm run check && npx tsx script/decision-state-tests.ts && npx tsx script/decision-runtime-tests.ts && npx tsx script/reply-context-verifier-tests.ts && npx tsx script/decision-doctrine-guard.ts && npm test
      - name: Commit verified repair and remove verification workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/understanding/meaning-engine.ts script/decision-state-tests.ts script/decision-runtime-tests.ts script/unit-tests.ts server/brain/reply-verifier.ts server/understanding/state.ts
          git rm server/understanding/decision-state.ts server/understanding/decision-runtime.ts .github/workflows/p0-repair-verified.yml
          git checkout origin/main -- .github/workflows/test.yml
          git add .github/workflows/test.yml
          git commit -m 'refactor: consolidate coaching decision policy and verifier rules'
          git push
