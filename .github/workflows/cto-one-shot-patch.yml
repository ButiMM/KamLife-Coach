name: CTO one-shot patch

on:
  push:
    branches: ["cto/one-shot"]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[cto-one-shot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cto/one-shot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply correction
        run: node scripts/cto-one-shot-fix.mjs
      - name: Commit correction
        run: |
          git config user.name "cto-builder"
          git config user.email "cto-builder@users.noreply.github.com"
          git add server/verifiers/response-gate.ts server/handlers/misc-commands.ts
          git diff --cached --quiet || git commit -m "fix: correct weight trend evidence binding [cto-one-shot]"
          git push origin cto/one-shot
