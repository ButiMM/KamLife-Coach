name: cto-one-shot-patch
on:
  pull_request_review:
    types: [submitted]
jobs:
  patch:
    if: github.event.pull_request.number == 94 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cto/one-shot-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply convergence patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          live = Path('server/understanding/live.ts')
          routes = Path('server/routes.ts')
          misc = Path('server/handlers/misc-commands.ts')
          test = Path('script/tracking-contract-tests.ts')

          # Structured coaching turn + single renderer for weight/trend.
          s = live.read_text()
          if 'export type CoachingTurn' not in s:
              marker = 'export async function canonicalDecision('
              idx = s.index(marker)
              block = '''export type CoachingTurn = {\n  kind: "coach";\n  decision: "HOLD" | "REPORT_TREND";\n  facts: {\n    currentKg: number | null;\n    changeKg: number;\n    trendUsable: boolean;\n    trendWhy: string | null;\n    goal: string;\n    recent: string[];\n  };\n};\n\nexport function composeCoachingTurn(turn: CoachingTurn): string {\n  const { currentKg, changeKg, trendUsable, trendWhy, goal, recent } = turn.facts;\n  const history = recent.length ? `Weight History\\n\\n${recent.join("\\n")}` : "Weight History";\n  if (turn.decision === "HOLD" || !trendUsable) {\n    const hold = trendWhy === "illness"\n      ? "I'm not going to call a trend off weigh-ins around your illness. Let's use clean morning weigh-ins."\n      : "I don't have enough clean weigh-ins yet to call a trend.";\n    return `${history}\\n\\n${hold}`.trim();\n  }\n  const prefix = currentKg !== null ? `Scale: ${currentKg.toFixed(1)}kg. ` : "";\n  if (goal === "muscle_gain" && changeKg > 0.5) return `${history}\\n\\n${prefix}Scale is up — keep fuelling.`.trim();\n  if (goal === "fat_loss" && changeKg < -1) return `${history}\\n\\n${prefix}Moving in the right direction.`.trim();\n  if (goal === "fat_loss" && changeKg >= 0) return `${history}\\n\\n${prefix}Scale hasn't moved yet — let's look at food logging consistency.`.trim();\n  return `${history}\\n\\n${prefix}Scale: ${changeKg > 0 ? "up" : changeKg < 0 ? "down" : "unchanged"} ${Math.abs(changeKg).toFixed(1)}kg since you started.`.trim();\n}\n\n'''
              s = s[:idx] + block + s[idx:]
              live.write_text(s)

          r = routes.read_text()
          old_import = 'import { runMeaningEngineLive, engineLive, resumeEngineConfirm, closeCoachingTurn as closeCoachingTurnFor } from "./understanding/live";'
          if old_import in r and 'composeCoachingTurn' not in r:
              r = r.replace(old_import, 'import { runMeaningEngineLive, engineLive, resumeEngineConfirm, closeCoachingTurn as closeCoachingTurnFor, composeCoachingTurn, type CoachingTurn } from "./understanding/live";', 1)

          # #94 already added a weight-specific early-return guard. Replace that whole guard with
          # structured-result handling: other misc strings keep their current behavior for now.
          old_route = '''  const miscResult = await handleMiscCommands({ phone, message, m, user, isQuestion: normalizedQuestion, wroteThisTurn });
  // COACHING SEAM: weight-progress is owned by the live Meaning Engine when it is enabled.
  // The deterministic evidence reader remains there; this handler must not terminate the turn
  // with prose before policy can decide.
  const _isWeightCoachingQuestion = /\\b(weight history|weight trend|my weights|all my weights|weight progress|how much (weight )?(have i|did i) (lost?|gained?)|total (weight )?(lost?|gained?)|weight (since|over time))\\b/i.test(m);
  if (miscResult !== null && !(_isWeightCoachingQuestion && engineLive())) return miscResult;'''
          new_route = '''  const miscResult = await handleMiscCommands({ phone, message, m, user, isQuestion: normalizedQuestion, wroteThisTurn });
  if (miscResult !== null) {
    if (typeof miscResult === "object" && (miscResult as CoachingTurn).kind === "coach") {
      return composeCoachingTurn(miscResult as CoachingTurn);
    }
    return miscResult;
  }'''
          assert old_route in r, 'current misc route guard not found'
          r = r.replace(old_route, new_route, 1)
          routes.write_text(r)

          m = misc.read_text()
          if 'import("../understanding/live").CoachingTurn' not in m:
              old_sig = '}): Promise<string | null> {'
              assert old_sig in m, 'misc signature missing'
              m = m.replace(old_sig, '}): Promise<string | import("../understanding/live").CoachingTurn | null> {', 1)
          old_ret = '      return `*${name2 ? name2 + "\'s " : ""}Weight History*\\n\\n${recent}\\n\\n${changeSummary} ${verdict}`.trim();'
          assert old_ret in m, 'weight return missing'
          new_ret = '''      return {\n        kind: "coach",\n        decision: trend.usable ? "REPORT_TREND" : "HOLD",\n        facts: {\n          currentKg: logs[logs.length - 1]?.kg ?? null,\n          changeKg: totalChange,\n          trendUsable: trend.usable,\n          trendWhy: trend.usable ? null : trend.why,\n          goal,\n          recent: logs.slice(-5).map(l => `• ${l.kg.toFixed(1)}kg — ${l.at.toLocaleDateString("en-ZA", { day: "numeric", month: "short" })}`),\n        },\n      };'''
          m = m.replace(old_ret, new_ret, 1)
          misc.write_text(m)

          # Exact T1 regression; keep test file only once.
          t = test.read_text()
          if '16:55 TREND CONTRADICTION' not in t:
              marker = '  /**\\n   * LAW 3 — THE ANSWER MUST QUOTE THE LEDGER'
              assert marker in t, 'tracking test insertion marker missing'
              block = '''  /** 16:55 TREND CONTRADICTION — HOLD must own the whole response. */\n  {\n    const { composeCoachingTurn } = await import("../server/understanding/live");\n    const hold = composeCoachingTurn({\n      kind: "coach",\n      decision: "HOLD",\n      facts: { currentKg: 85.75, changeKg: 1.2, trendUsable: false, trendWhy: "illness", goal: "muscle_gain", recent: [] },\n    });\n    if (/going up|going down|keep fuelling|trend is/i.test(hold)) {\n      failures.push(`16:55 HOLD leaked a trend act: ${hold}`);\n    }\n  }\n\n'''
              t = t.replace(marker, block + marker, 1)
              test.write_text(t)

          # Remove all temporary patch artifacts from the branch.
          for p in [Path('.github/ONE_SHOT_TRIGGER.tmp'), Path('.github/workflows/one-shot-weight-seam.yml')]:
              if p.exists(): p.unlink()

          # Final assertions.
          assert 'export type CoachingTurn' in live.read_text()
          assert 'composeCoachingTurn(miscResult as CoachingTurn)' in routes.read_text()
          assert 'kind: "coach"' in misc.read_text()
          assert '16:55 TREND CONTRADICTION' in test.read_text()
          PY
          git config user.name 'cto-builder'
          git config user.email 'cto-builder@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: close weight coaching response seam'
          git push origin HEAD:cto/one-shot-final
