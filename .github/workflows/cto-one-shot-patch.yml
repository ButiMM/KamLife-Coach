name: cto-one-shot-patch
on:
  pull_request_review:
    types: [submitted]
jobs:
  patch:
    if: github.event.pull_request.number == 94 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cto/one-shot-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply convergence patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          live = Path('server/understanding/live.ts')
          routes = Path('server/routes.ts')
          misc = Path('server/handlers/misc-commands.ts')
          tests = Path('script/tracking-contract-tests.ts')
          
          # Existing live authority seam. Keep this in the existing module; do not create a second
          # architecture layer. Structured coaching turn contains facts + decision only, never prose.
          s = live.read_text()
          if 'export type CoachingTurn' not in s:
              marker = 'export async function canonicalDecision('
              assert marker in s
              block = '''export type CoachingTurn = {\n  kind: "coach";\n  decision: "HOLD" | "REPORT_TREND";\n  facts: {\n    currentKg: number | null;\n    changeKg: number;\n    trendUsable: boolean;\n    trendWhy: string | null;\n    goal: string;\n    recent: string[];\n  };\n};\n\nexport function composeCoachingTurn(turn: CoachingTurn): string {\n  const { currentKg, changeKg, trendUsable, trendWhy, goal, recent } = turn.facts;\n  const history = recent.length ? `*Weight History*\\n\\n${recent.join("\\n")}` : "*Weight History*";\n  if (turn.decision === "HOLD" || !trendUsable) {\n    return `${history}\\n\\n${trendWhy === "illness" ? "I'm not going to call a trend off weigh-ins around your illness. Let's use clean morning weigh-ins." : "I don't have enough clean weigh-ins yet to call a trend."}`.trim();\n  }\n  const prefix = currentKg !== null ? `Scale: ${currentKg.toFixed(1)}kg. ` : "";\n  if (goal === "muscle_gain" && changeKg > 0.5) return `${history}\\n\\n${prefix}Scale is up — keep fuelling.`.trim();\n  if (goal === "fat_loss" && changeKg < -1) return `${history}\\n\\n${prefix}Moving in the right direction.`.trim();\n  if (goal === "fat_loss" && changeKg >= 0) return `${history}\\n\\n${prefix}Scale hasn't moved yet — let's look at food logging consistency.`.trim();\n  return `${history}\\n\\n${prefix}Scale: ${changeKg > 0 ? "up" : changeKg < 0 ? "down" : "unchanged"} ${Math.abs(changeKg).toFixed(1)}kg since you started.`.trim();\n}\n\n'''
              s = s.replace(marker, block + marker, 1)
              live.write_text(s)
          
          # Routes: convert the existing misc early-return to structured-coach handling. This is
          # intentionally local; non-coaching misc strings keep their current transactional behavior.
          r = routes.read_text()
          if 'type CoachingTurn' not in r:
              imp = 'import { runMeaningEngineLive, engineLive, resumeEngineConfirm, closeCoachingTurn as closeCoachingTurnFor } from "./understanding/live";'
              assert imp in r
              r = r.replace(imp, 'import { runMeaningEngineLive, engineLive, resumeEngineConfirm, closeCoachingTurn as closeCoachingTurnFor, composeCoachingTurn, type CoachingTurn } from "./understanding/live";', 1)
          
          pattern = re.compile(r'  const miscResult = await handleMiscCommands\(\{ phone, message, m, user, isQuestion: normalizedQuestion, wroteThisTurn \}\);\n(?:(?:  //[^\n]*\n)|(?:  const _isWeightCoachingQuestion[^\n]*\n)|(?:  if \(miscResult !== null && !\([^\n]*\n)|(?:  if \(miscResult !== null\) return miscResult;\n))*', re.M)
          mobj = pattern.search(r)
          assert mobj, 'could not locate misc result block'
          replacement = '''  const miscResult = await handleMiscCommands({ phone, message, m, user, isQuestion: normalizedQuestion, wroteThisTurn });\n  if (miscResult !== null) {\n    if (typeof miscResult === "object" && (miscResult as CoachingTurn).kind === "coach") {\n      return composeCoachingTurn(miscResult as CoachingTurn);\n    }\n    return miscResult;\n  }\n'''
          r = r[:mobj.start()] + replacement + r[mobj.end():]
          routes.write_text(r)
          
          # Misc: only the weight-history branch changes its return type; it never returns a finished
          # coaching sentence after this change.
          mc = misc.read_text()
          sig = re.search(r'(export async function handleMiscCommands\(ctx: \{.*?\}\): Promise<)string \| null( \{)', mc, re.S)
          assert sig, 'misc signature not found'
          mc = mc[:sig.start()] + sig.group(1) + 'string | import("../understanding/live").CoachingTurn | null' + sig.group(2) + mc[sig.end():]
          old_ret = re.compile(r'      return `\*\$\{name2 \? name2 \+ "\'s " : ""\}Weight History\*\\n\\n\$\{recent\}\\n\\n\$\{changeSummary\} \$\{verdict\}`\.trim\(\);')
          assert old_ret.search(mc), 'weight prose return not found'
          new_ret = '''      return {\n        kind: "coach",\n        decision: trend.usable ? "REPORT_TREND" : "HOLD",\n        facts: {\n          currentKg: logs[logs.length - 1]?.kg ?? null,\n          changeKg: totalChange,\n          trendUsable: trend.usable,\n          trendWhy: trend.usable ? null : trend.why,\n          goal,\n          recent: logs.slice(-5).map(l => `• ${l.kg.toFixed(1)}kg — ${l.at.toLocaleDateString("en-ZA", { day: "numeric", month: "short" })}`),\n        },\n      };'''
          mc = old_ret.sub(new_ret, mc, count=1)
          misc.write_text(mc)
          
          # Exact 16:55 regression, test only. HOLD must not emit any trend direction or compensating act.
          tc = tests.read_text()
          if '16:55 TREND CONTRADICTION' not in tc:
              marker = '  /**\\n   * LAW 3 — THE ANSWER MUST QUOTE THE LEDGER'
              assert marker in tc, 'test marker missing'
              block = '''  /** 16:55 TREND CONTRADICTION — HOLD owns the whole response. */\n  {\n    const { composeCoachingTurn } = await import("../server/understanding/live");\n    const hold = composeCoachingTurn({\n      kind: "coach",\n      decision: "HOLD",\n      facts: { currentKg: 85.75, changeKg: 1.2, trendUsable: false, trendWhy: "illness", goal: "muscle_gain", recent: [] },\n    });\n    if (/going up|going down|keep fuelling|trend is/i.test(hold)) {\n      failures.push(`16:55 HOLD leaked a trend act: ${hold}`);\n    }\n  }\n\n'''
              tc = tc.replace(marker, block + marker, 1)
              tests.write_text(tc)
          
          # The patch is only valid if the old weight prose return is gone and the route sees CoachingTurn.
          assert 'Weight History*\\n\\n${recent}\\n\\n${changeSummary} ${verdict}' not in misc.read_text()
          assert 'typeof miscResult === "object"' in routes.read_text()
          assert 'export type CoachingTurn' in live.read_text()
          assert '16:55 TREND CONTRADICTION' in tests.read_text()
          PY
          git config user.name 'KamLife CTO'
          git config user.email 'cto@kamlife.local'
          git add -A
          git diff --cached --check
          git commit -m 'feat: close weight coaching response seam'
          git push origin HEAD:cto/one-shot-final
