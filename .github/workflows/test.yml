''')
          temp.unlink(missing_ok=True) if hasattr(Path, 'unlink') else None

      - name: Type check integrated branch
        run: npm run check
      - name: Focused tests
        run: |
          npx tsx script/reaction-guard-tests.ts
          npx tsx script/current-date-tests.ts
          npx tsx script/day-relative-situation-tests.ts
          npx tsx script/coach-loop-foundation-tests.ts
      - name: Commit integrated slice
        run: |
          git config user.name "KamLife CTO Builder"
          git config user.email "cto-builder@kamlife.local"
          git add server/memory.ts server/handlers/misc-commands.ts server/routes.ts server/unlogged-notice.ts server/handlers/gpt-block.ts script/coach-loop-foundation-tests.ts .github/workflows/test.yml .github/workflows/cto-primary-builder.yml
          git commit -m "Coach loop: integrate continuity owners"
          git push origin HEAD:${GITHUB_HEAD_REF}
