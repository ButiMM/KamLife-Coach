name: Tests

# Runs the full test + type-check suite on every push and PR.
#
# WHY THIS EXISTS: a green test suite that only runs when someone remembers to type
# `npm test` is worse than no suite — it gives false confidence. For months, bugs
# (e.g. the fabricated-composite double-counting) were live in production while the
# suite was green locally, because nothing forced the suite to run before a change
# shipped. This workflow makes red/green an enforced gate, not a memory exercise.
#
# The whole suite is pure (no real DB, no network) — the food-scanner tests set a
# dummy DATABASE_URL and the AI calls run in offline mode — so it runs anywhere.

# NOT on push (2026-07-16): Actions minutes are exhausted, so every push spawned an
# instant billing-gate failure + a "Run failed" email — dozens a day screaming at the
# founder about nothing. The builder runs the full suite locally before every push;
# CI re-verifies on PRs, once nightly, and on demand. Re-add push triggers when the
# minutes quota is refilled.
on:
  pull_request:
  schedule:
    - cron: "0 2 * * *" # 4am SAST, once daily
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-baseline:
    # This is deliberately PR-only: only a pull request has an authoritative base SHA.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # compare-unit-baseline verifies this is the exact head, then asks git for its merge base.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Baseline comparator positive control
        run: npm run test:unit:baseline:control
      - name: Unit failures compared to exact merge base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run test:unit:baseline

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - id: dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Test suite
        run: npm test

      # THE GAUNTLET (2026-08-04) — the verifier for the one-brain rebuild.
      #
      # It is RED on purpose right now, and its redness is the proof it works: it detects the
      # known defects in the build as it stands (receipts, walls, invented numbers, a batch
      # answered with three messages). Blocking on it today would wedge every unrelated commit
      # for the length of the rebuild, so it REPORTS rather than blocks — but it runs on every
      # PR, so a slice that claims a column went green can be checked rather than believed.
      #
      # SLICE 5 DELETES the `continue-on-error` line. A fully green gauntlet is the gate on the
      # live flip; from that moment on, red is a broken build like anything else.
      - name: Gauntlet (reporting only until Slice 5)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run gauntlet
        continue-on-error: true

  # ── REAL POSTGRESQL, FOR THE ONE CONTRACT THE FIXTURE CANNOT PROVE (#164) ──────────────────
  #
  # The deterministic stub ignores ORDER BY and does not reflect UPDATEs into reads, so it cannot
  # say WHICH row a named-day food correction lands on. Two PRs correctly refused to infer that
  # (#159, #161); this job is the answer rather than a smarter fake.
  #
  # SCOPED ON PURPOSE. One ephemeral service container, one focused script, its own job — every
  # pure suite above still runs with no database and no network. Nothing here needs a secret:
  # the credentials are the throwaway ones this container is created with, and no production or
  # Railway data is reachable from it.
  pg-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kam
          POSTGRES_PASSWORD: kam
          POSTGRES_DB: kamlife
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://kam:kam@127.0.0.1:5432/kamlife
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # COMMITTED MIGRATIONS, THE SAME ONES A DEPLOY APPLIES. check-schema-safety forbids the
      # schema-sync shortcut in any workflow, for the reason it names: a bad sync corrupts the
      # day-ledger and the only way back is the 6-hourly backup. It also scans this file as text,
      # so the forbidden command is not written here even in a comment.
      - name: Apply committed migrations to the ephemeral database
        run: npm run db:migrate
      - name: Targeted multi-day food correction on real PostgreSQL
        run: npx tsx script/pg-correction-acceptance.ts
      - name: Safety early-return turn attribution on real PostgreSQL
        run: npx tsx script/pg-safety-turn-acceptance.ts
      # THE PROVENANCE OWNER IS A DATABASE FUNCTION (#184), so PostgreSQL is the only thing that
      # can say whether its regular expressions compile. The broken version threw inside an
      # AFTER INSERT trigger the application never awaits — a green suite, a normal reply, and
      # every client-stated step count silently left untrusted.
      - name: Step provenance bridge on real PostgreSQL
        run: npx tsx script/pg-step-provenance-acceptance.ts
      - name: Canonical client truth ordering on real PostgreSQL
        run: npx tsx script/pg-client-truth-acceptance.ts
      # TWO READERS, ONE SET OF FACTS (#179). Provenance, resolved_day and the workout ledger are
      # COLUMNS, so only a real database can show that the canonical snapshot and the GPT
      # fallback's context are reading the same rows — a fixture that answers every query the
      # same way cannot tell two readers apart, which is how the divergence survived.
      - name: Fallback reads canonical truth on real PostgreSQL
        run: npx tsx script/pg-fallback-truth-acceptance.ts
      # ONE COACH, PROACTIVELY AND REACTIVELY (#180). Held constraints are rows the client wrote
      # today; whether the proactive decision reads them is only answerable against a database.
      - name: Proactive decision authority on real PostgreSQL
        run: npx tsx script/pg-proactive-authority-acceptance.ts
      # A DAILY CONSTRAINT IS ABOUT WHAT SURVIVES (#194). The defect was a 24-message window, and
      # a fixture that returns the same rows to every query cannot demonstrate a window.
      - name: Daily constraint lifecycle on real PostgreSQL
        run: npx tsx script/pg-daily-constraint-acceptance.ts
      # THE SIX JOURNEYS (#170). Same database, same migrations, same front door — a second job
      # would be a second copy of this infrastructure for no gain. Deliberately NOT
      # continue-on-error: the whole point of the lab is that a known-wrong durable state cannot
      # be reported as a warning, and a lane that goes yellow on a real defect is that warning
      # wearing a different colour.
      - name: Six critical journeys through the real system
        run: npm run test:journeys
