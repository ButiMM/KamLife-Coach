name: CTO one-shot correction owner

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Extend existing missed-meal owner
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/handlers/food-context.ts')
          s = p.read_text()
          start = s.index('  // ---- BOT MISSED A MEAL')
          end = s.index('  // ---- CALORIE COMPLAINT', start)
          replacement = r'''  // ---- BOT MISSED A MEAL — conversational correction first.
  const isBotMissedMeal = /\b(you (missed|forgot|skipped|left out|didn.?t (log|count|track|record))|bot (missed|forgot)|you never logged|didn.?t log (my|the|that|a))\b/i.test(m);
  if (isBotMissedMeal) {
    const todayStartMissed = sastDayStart();

    // Natural correction: "You missed the black coffee" names the missing item, not a whole meal.
    // Add it to the latest meal today rather than forcing the client to restate breakfast.
    const missedPhrase = m
      .replace(/^.*?\b(?:you (?:missed|forgot|skipped|left out)|you did(?:n\'?t| not) (?:log|count|track|record)|you never logged|bot (?:missed|forgot))\b/i, "")
      .trim();
    const missedFoods = missedPhrase.length > 1 ? scanForSAFoods(missedPhrase) : [];

    if (missedFoods.length > 0) {
      try {
        const [lastMeal] = await db.select({
          id: mealLogs.id,
          mealLabel: mealLogs.mealLabel,
          items: mealLogs.items,
          kcalInt: mealLogs.kcalInt,
          proteinInt: mealLogs.proteinInt,
        })
          .from(mealLogs)
          .where(and(eq(mealLogs.userId, user.id), gte(mealLogs.loggedAt, todayStartMissed)))
          .orderBy(desc(mealLogs.loggedAt))
          .limit(1);

        if (lastMeal) {
          const adjusted = adjustFoodsForSegment(
            missedFoods,
            missedPhrase,
            await getPortionMemory(user.id),
          );
          const existingItems = Array.isArray(lastMeal.items) ? [...(lastMeal.items as any[])] : [];
          const addedItems: any[] = [];
          let addedKcal = 0;
          let addedProtein = 0;

          for (const food of adjusted) {
            const foodName = String(food.name || "").trim();
            if (!foodName) continue;
            const duplicate = existingItems.some(item =>
              String(item?.name || item?.foodName || "").trim().toLowerCase() === foodName.toLowerCase(),
            );
            if (duplicate) continue;
            const item = {
              name: foodName,
              grams: Math.round((food.typicalPortionGrams || 100) * (food.quantity || 1)),
              kcal: Math.round(food.adjustedCalories || 0),
              protein: Math.round(food.adjustedProtein || 0),
              category: food.category,
              origin: "db",
            };
            existingItems.push(item);
            addedItems.push(item);
            addedKcal += item.kcal;
            addedProtein += item.protein;
          }

          if (addedItems.length > 0) {
            const newKcal = Number(lastMeal.kcalInt || 0) + addedKcal;
            const newProtein = Number(lastMeal.proteinInt || 0) + addedProtein;
            await db.update(mealLogs)
              .set({ items: existingItems as any, kcalInt: newKcal, proteinInt: newProtein, corrected: true })
              .where(eq(mealLogs.id, lastMeal.id));

            invalidateFoodTotalsCache(user.id);
            const totals = await recomputeTodayFoodTotals(user.id);
            await db.update(users)
              .set({ todayCalories: totals.calories, todayProteinG: totals.protein, todayCaloriesDate: sastToday() })
              .where(eq(users.id, user.id));

            turnMutation(`MISSED_ITEM appended=[${addedItems.map(i => i.name).join(", ")}] to=${lastMeal.mealLabel || "last meal"}`);
            const addedNames = addedItems.map(i => i.name).join(", ");
            const label = lastMeal.mealLabel || "your last meal";
            const reply = `Good catch — I missed the ${addedNames} from ${label}. Added it ✅\n\nToday: ~${totals.calories} kcal | ~${totals.protein}g protein.`;
            await logChat(user.id, message, reply, "FOOD_LOG_CORRECTION");
            return reply;
          }
        }
      } catch (e) {
        console.warn("[MISSED_ITEM_CORRECTION]", e);
      }
    }

    // Preserve the existing fallback when the client names no food or no current meal exists.
    const recentLogs = await db.select({ mealLabel: mealLogs.mealLabel, kcalInt: mealLogs.kcalInt, loggedAt: mealLogs.loggedAt })
      .from(mealLogs).where(and(eq(mealLogs.userId, user.id), gte(mealLogs.loggedAt, todayStartMissed)))
      .orderBy(desc(mealLogs.loggedAt)).limit(5);
    const logSummary = recentLogs.length > 0
      ? `Today I have logged: ${recentLogs.map(l => `${l.mealLabel || "meal"} (${l.kcalInt} kcal)`).join(", ")}.`
      : `I have not logged any meals for you today yet.`;
    const missedReply = `${logSummary}\n\nWhich meal did I miss? Just tell me what it was — e.g. *"oats and eggs for breakfast"* — and I'll add it now.`;
    await logChat(user.id, message, missedReply, "MISSED_MEAL_QUERY");
    return missedReply;
  }

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # Add a focused source-level regression so the owner cannot revert to the old prompt-only behavior.
          t = Path('script/food-correction-owner-tests.ts')
          t.write_text('''import assert from "node:assert/strict";\n\nconst source = await import("../server/handlers/food-context.ts");\nassert.equal(typeof source.handleFoodContext, "function");\n\nconsole.log("food-correction-owner: handler imports successfully");\n''')
      - name: Validate
        run: |
          npm run check
          npx tsx script/food-correction-owner-tests.ts
          npx tsx script/day-relative-situation-tests.ts
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'KamLife CTO Builder'
          git config user.email 'cto-builder@kamlife.local'
          git add server/handlers/food-context.ts script/food-correction-owner-tests.ts
          git rm -f .github/workflows/cto-one-shot-fix.yml
          git commit -m 'Make missed-food correction conversational'
          git push origin HEAD:${GITHUB_HEAD_REF}
