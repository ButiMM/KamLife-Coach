name: CTO one-shot situation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fix semantic day-relative situation
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/understanding/day-relative-situation.ts')
          s = p.read_text()
          if 'const WEEKEND_RE = /\\bweekend\\b/i;' not in s:
              anchor = 'const THIS_WEEKEND_RE = /\\bthis weekend\\b/i;'
              assert anchor in s
              s = s.replace(anchor, anchor + '\nconst WEEKEND_RE = /\\bweekend\\b/i;', 1)
          start = s.index('export function resolveSituationMoment(')
          end = s.index('export function classifySituationMessage', start)
          replacement = '''function sastCalendarDay(date: Date): string {\n  return new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Johannesburg", year: "numeric", month: "2-digit", day: "2-digit" }).format(date);\n}\n\nexport function resolveSituationMoment(text: string, at: Date, now = new Date()): SituationMoment {\n  const raw = String(text || "").trim();\n  const explicitPast = EXPLICIT_PAST_NIGHT_RE.test(raw) || EXPLICIT_PAST_RE.test(raw);\n  const senderDay = sastCalendarDay(at);\n  const currentDay = sastCalendarDay(now);\n\n  // Semantic past beats a co-occurring literal "today/tonight". Monday: "birthday weekend was hectic,\n  // skipping today" describes the finished weekend, not a current birthday outing.\n  if (WEEKEND_RE.test(raw) && explicitPast && /^(Mon|Tue)$/i.test(sastWeekday(now))) return "last_night";\n  if (EXPLICIT_PAST_NIGHT_RE.test(raw)) return ageMoment(at, now) === "today" ? "last_night" : ageMoment(at, now);\n\n  // Relative today/tonight belongs to the sender's SAST calendar day. A Sunday message saying "tonight"\n  // becomes last_night when read Monday.\n  if (EXPLICIT_TODAY_RE.test(raw)) {\n    if (senderDay === currentDay) return explicitPast ? ageMoment(at, now) : "today";\n    const senderDate = new Date(`${senderDay}T12:00:00Z`).getTime();\n    const currentDate = new Date(`${currentDay}T12:00:00Z`).getTime();\n    const diffDays = Math.floor((currentDate - senderDate) / 86_400_000);\n    if (diffDays === 1) return "last_night";\n    if (diffDays > 1) return "stale";\n  }\n\n  if (explicitPast && /\\b(?:weekend|last night|yesterday)\\b/i.test(raw) && /^(Mon|Tue)$/i.test(sastWeekday(now))) return "last_night";\n  if (explicitPast) return ageMoment(at, now);\n  return ageMoment(at, now);\n}\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
      - name: Validate
        run: |
          npm run check
          npx tsx script/day-relative-situation-tests.ts
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'KamLife CTO Builder'
          git config user.email 'cto-builder@kamlife.local'
          git add server/understanding/day-relative-situation.ts
          git rm -f .github/workflows/cto-one-shot-fix.yml
          git commit -m 'Fix semantic day-relative situation'
          git push origin HEAD:${GITHUB_HEAD_REF}
