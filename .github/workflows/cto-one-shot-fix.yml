name: CTO one-shot fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integrate exact Coach-loop owners
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Canonical decision type boundary
          p = Path('server/handlers/gpt-block.ts')
          s = p.read_text()
          old = 'const decision = await canonicalDecision(user, message).catch(() => ({ todo: "", kind: "hold" }));'
          new = 'const decision = (await canonicalDecision(user, message).catch(() => ({ todo: "", kind: "hold", reply: "" }))) as { todo: string; kind: string; reply: string };'
          if old in s: s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Deterministic current-date and natural step follow-up in the existing misc owner.
          p = Path('server/handlers/misc-commands.ts')
          s = p.read_text()
          if 'from "../understanding/current-date"' not in s:
              needle_import = 'import { daysOnProgramme } from "../day-ledger-core";\n'
              assert needle_import in s
              s = s.replace(needle_import, needle_import + 'import { currentDateAnswer, isCurrentDateQuestion } from "../understanding/current-date";\n', 1)
          anchor = '  const { phone, message, m, user, wroteThisTurn } = ctx;\n'
          block = '''  if (isCurrentDateQuestion(message)) {\n    const reply = currentDateAnswer();\n    await logChat(user.id, message, reply, "CURRENT_DATE");\n    return reply;\n  }\n\n  if (/^(?:and|what about|how about)\\s+(?:the\\s+)?steps\\s*\\?$/i.test(m.trim())) {\n    const [todayStep] = await db.select({ steps: stepLogs.steps })\n      .from(stepLogs)\n      .where(and(eq(stepLogs.userId, user.id), gte(stepLogs.loggedAt, sastDayStart())))\n      .orderBy(desc(stepLogs.loggedAt))\n      .limit(1);\n    const steps = Number(todayStep?.steps || 0);\n    const target = Number(user.stepsTarget) || 8500;\n    const name = getDisplayName(user) || "there";\n    const reply = !steps\n      ? `${name} — nothing logged yet today. Your target is ${target.toLocaleString()} steps.`\n      : steps >= target\n        ? `${name} — ${steps.toLocaleString()} steps today. Target hit ✅`\n        : `${name} — ${steps.toLocaleString()} steps so far. ${Math.max(0, target - steps).toLocaleString()} to hit your target.`;\n    await logChat(user.id, message, reply, "STEP_FOLLOW_UP");\n    return reply;\n  }\n'''
          if 'CURRENT_DATE' not in s:
              assert anchor in s
              s = s.replace(anchor, anchor + '\n' + block, 1)
          p.write_text(s)

          # 3) Future intent must beat the broad feeling detector.
          p = Path('server/unlogged-notice.ts')
          s = p.read_text()
          old = '''export function carriesFeelingClause(text: string): boolean {\n  return /\\b(i feel|i\\'m feeling|im feeling|i felt|feel like|feeling like|i think i|ruined|failed|guilty|ashamed|disappointed|gave up|giving up|fell off|messed up|stressing me|so stressed|really stressed|depressed|anxious|can\\'?t cope)\\b/i.test(text || "");\n}\n'''
          new = '''export function carriesFeelingClause(text: string): boolean {\n  const raw = String(text || "");\n  if (/\\b(?:i think i(?:\\'m| am) going to|i(?:\\'m| am) going to|i\\'?ll|i will)\\b/i.test(raw)) return false;\n  return /\\b(i feel|i\\'m feeling|im feeling|i felt|feel like|feeling like|i think i|ruined|failed|guilty|ashamed|disappointed|gave up|giving up|fell off|messed up|stressing me|so stressed|really stressed|depressed|anxious|can\\'?t cope)\\b/i.test(raw);\n}\n'''
          if old in s: s = s.replace(old, new, 1)
          p.write_text(s)

          # 4) Existing situation owner uses the stamped resolver so older messages cannot contaminate a newer current-day message.
          p = Path('server/memory.ts')
          s = p.read_text()
          if 'from "./understanding/day-relative-situation"' not in s:
              needle_import = 'import { sastDaysBetween } from "./sast";\n'
              assert needle_import in s
              s = s.replace(needle_import, needle_import + 'import { resolveRecentSituation } from "./understanding/day-relative-situation";\n', 1)
          helper = '''function situationLineForResolved(resolved: { kind: string; moment: string }): string {\n  if (resolved.kind === "celebration_outing") return "CURRENT SITUATION: Client has a celebration outing around the referenced period; restaurant eating is expected.";\n  if (resolved.kind === "celebration") return "CURRENT SITUATION: Client is in a birthday/celebration period around the referenced day.";\n  if (resolved.kind === "eating_out") return "CURRENT SITUATION: Client expects to eat out around the referenced period.";\n  if (resolved.kind === "food_closed") return "CURRENT SITUATION: Client has closed food around the referenced period.";\n  return "";\n}\n'''
          if 'function situationLineForResolved' not in s:
              s = s.replace('export function extractSalientSituation(clientMessages: string[]): string {', helper + '\nexport function extractSalientSituation(clientMessages: string[]): string {', 1)
          old_load = re.search(r'export async function loadSalientSituation\(phone: string, currentMessage\?: string\): Promise<string> \{.*?\n\}\n\nexport async function loadSituationFrame', s, re.S)
          new_load = '''export async function loadSalientSituation(phone: string, currentMessage?: string): Promise<string> {\n  const stamped = await recentClientMessagesStamped(phone);\n  if (currentMessage) stamped.unshift({ text: currentMessage, at: new Date() });\n  return situationLineForResolved(resolveRecentSituation(stamped));\n}\n\nexport async function loadSituationFrame'''
          if old_load:
              s = s[:old_load.start()] + new_load + s[old_load.end():]
          old_frame = re.search(r'export async function loadSituationFrame\(phone: string, currentMessage\?: string\): Promise<string> \{.*?\n\}\n\nexport async function recentClientMessagesStamped', s, re.S)
          new_frame = '''export async function loadSituationFrame(phone: string, currentMessage?: string): Promise<string> {\n  const stamped = await recentClientMessagesStamped(phone);\n  if (currentMessage) stamped.unshift({ text: currentMessage, at: new Date() });\n  const resolved = resolveRecentSituation(stamped);\n  if (!resolved.kind || resolved.moment === "stale") return "";\n  return frameSituationForClient(situationLineForResolved(resolved), resolved.moment as any);\n}\n\nexport async function recentClientMessagesStamped'''
          if old_frame:
              s = s[:old_frame.start()] + new_frame + s[old_frame.end():]
          old_render = '''  if (/celebration outing/i.test(s)) {\n    return when === "last_night"\n      ? "Last night was the birthday outing. Today we start the week — no chasing yesterday."\n      : "Today is the birthday outing, so we're not trying to make the whole day perfect. Enjoy yourself — we'll keep the rest of the day sensible.";\n  }\n'''
          new_render = '''  if (/celebration outing/i.test(s)) {\n    return when === "last_night"\n      ? "Last night was the birthday outing. Today we start the week — no chasing yesterday."\n      : "Today is the birthday outing, so we're not trying to make the whole day perfect. Enjoy yourself — we'll keep the rest of the day sensible.";\n  }\n  if (/birthday\\/celebration period/i.test(s)) {\n    return when === "last_night"\n      ? "Last night was part of the birthday weekend. Today we start the week — no chasing yesterday."\n      : "It's a birthday period today. Enjoy it without trying to make the day perfect.";\n  }\n'''
          if old_render in s: s = s.replace(old_render, new_render, 1)
          p.write_text(s)

          # 5) Unicode pictographs after a reaction word are reaction filler, not message content.
          p = Path('server/reaction-guard.ts')
          s = p.read_text()
          old = '    .replace(/[\\u200d\\ufe0f\\u{1f3fb}-\\u{1f3ff}]/gu, "")\n'
          new = '    .replace(/[\\u200d\\ufe0f\\u{1f3fb}-\\u{1f3ff}]/gu, "")\n    .replace(/\\p{Extended_Pictographic}/gu, "")\n'
          assert old in s
          if 'Extended_Pictographic' not in s: s = s.replace(old, new, 1)
          p.write_text(s)

          # 6) Extend the existing missed-meal owner to merge an explicitly named missing food into the latest logged meal.
          p = Path('server/handlers/food-context.ts')
          s = p.read_text()
          anchor = '''  if (isBotMissedMeal) {\n    const todayStartMissed = sastDayStart();\n'''
          insert = '''  if (isBotMissedMeal) {\n    const missedPhrase = m.replace(/^.*?\\b(?:you (?:missed|forgot|skipped|left out)|you did(?:n\\'?t| not) (?:log|count|track|record)|you never logged|bot (?:missed|forgot))\\b/i, "").trim();\n    const missedFoods = missedPhrase.length > 1 ? scanForSAFoods(missedPhrase) : [];\n    if (missedFoods.length > 0) {\n      try {\n        const [lastMeal] = await db.select({ id: mealLogs.id, items: mealLogs.items, kcalInt: mealLogs.kcalInt, proteinInt: mealLogs.proteinInt, mealLabel: mealLogs.mealLabel })\n          .from(mealLogs)\n          .where(and(eq(mealLogs.userId, user.id), gte(mealLogs.loggedAt, sastDayStart())))\n          .orderBy(desc(mealLogs.loggedAt))\n          .limit(1);\n        if (lastMeal) {\n          const additions = adjustFoodsForSegment(missedFoods, missedPhrase, await getPortionMemory(user.id));\n          const items = Array.isArray(lastMeal.items) ? [...(lastMeal.items as any[])] : [];\n          const newItems = [...items];\n          let addedKcal = 0;\n          let addedProtein = 0;\n          for (const food of additions) {\n            const duplicate = newItems.some((item: any) => String(item?.name || item?.foodName || "").toLowerCase() === String(food.name || "").toLowerCase());\n            if (duplicate) continue;\n            newItems.push({ name: food.name, kcal: food.adjustedCalories || 0, protein: food.adjustedProtein || 0 });\n            addedKcal += food.adjustedCalories || 0;\n            addedProtein += food.adjustedProtein || 0;\n          }\n          if (newItems.length > items.length) {\n            const newKcal = Number(lastMeal.kcalInt || 0) + addedKcal;\n            const newProtein = Number(lastMeal.proteinInt || 0) + addedProtein;\n            await db.update(mealLogs).set({ items: newItems as any, kcalInt: newKcal, proteinInt: newProtein, corrected: true }).where(eq(mealLogs.id, lastMeal.id));\n            invalidateFoodTotalsCache(user.id);\n            const totals = await recomputeTodayFoodTotals(user.id);\n            await db.update(users).set({ todayCalories: totals.calories, todayProteinG: totals.protein, todayCaloriesDate: sastToday() }).where(eq(users.id, user.id));\n            turnMutation(`MISSED_ITEM added=[${missedFoods.map(f => f.name).join(", ")}] to=${lastMeal.mealLabel || "last meal"}`);\n            const addedNames = newItems.slice(items.length).map((i: any) => i.name).join(", ");\n            const label = lastMeal.mealLabel || "your last meal";\n            await logChat(user.id, message, `Added ${addedNames} to ${label} ✅\\n\\nToday: ~${totals.calories} kcal | ~${totals.protein}g protein.`, "FOOD_LOG_CORRECTION");\n            return `Added ${addedNames} to ${label} ✅\\n\\nToday: ~${totals.calories} kcal | ~${totals.protein}g protein.`;\n          }\n        }\n      } catch (e) { console.warn("[MISSED_MEAL_ITEM]", e); }\n    }\n    const todayStartMissed = sastDayStart();\n'''
          assert anchor in s
          if 'MISSED_ITEM added=' not in s: s = s.replace(anchor, insert, 1)
          p.write_text(s)

          # 7) Broaden the pure situation resolver to recognize birthday/celebration periods without a restaurant word.
          p = Path('server/understanding/day-relative-situation.ts')
          s = p.read_text()
          s = s.replace('export type SituationKind = "celebration_outing" | "eating_out" | "food_closed" | "";', 'export type SituationKind = "celebration_outing" | "celebration" | "eating_out" | "food_closed" | "";')
          s = s.replace('const THIS_WEEKEND_RE = /\\bthis weekend\\b/i;\n', 'const THIS_WEEKEND_RE = /\\bthis weekend\\b/i;\nconst CELEBRATION_PERIOD_RE = /\\b(?:birthday|anniversary|wedding)(?:\\s+weekend)?\\b|\\bcelebration(?:\\s+weekend)?\\b|\\bparty\\b/i;\n')
          s = s.replace('  if (birthday && eatingOut) kind = "celebration_outing";\n  else if (eatingOut) kind = "eating_out";', '  if (birthday && eatingOut) kind = "celebration_outing";\n  else if (birthday && (THIS_WEEKEND_RE.test(raw) || CELEBRATION_PERIOD_RE.test(raw))) kind = "celebration";\n  else if (eatingOut) kind = "eating_out";')
          p.write_text(s)

          # 8) Correct existing regression to the more precise celebration kind.
          p = Path('script/day-relative-situation-tests.ts')
          s = p.read_text().replace('assert.equal(mixed.kind, "celebration_outing");', 'assert.equal(mixed.kind, "celebration");')
          p.write_text(s)

      - name: Validate integrated slice
        run: |
          npm run check
          npx tsx script/reaction-guard-tests.ts
          npx tsx script/current-date-tests.ts
          npx tsx script/day-relative-situation-tests.ts
          npx tsx script/coach-loop-foundation-tests.ts
          git diff --check

      - name: Commit integrated slice to builder branch
        run: |
          git config user.name 'KamLife CTO Builder'
          git config user.email 'cto-builder@kamlife.local'
          git add server/handlers/gpt-block.ts server/handlers/misc-commands.ts server/unlogged-notice.ts server/memory.ts server/reaction-guard.ts server/handlers/food-context.ts server/understanding/day-relative-situation.ts script/day-relative-situation-tests.ts
          git commit -m 'Coach loop: preserve lived context and conversational corrections'
          git push origin HEAD:${GITHUB_HEAD_REF}
