name: CTO one-shot interaction owners

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire current date and natural step follow-up
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/handlers/misc-commands.ts')
          s = p.read_text()

          if 'from "../understanding/current-date"' not in s:
              anchor = 'import { daysOnProgramme } from "../day-ledger-core";\n'
              assert anchor in s
              s = s.replace(anchor, anchor + 'import { currentDateAnswer, isCurrentDateQuestion } from "../understanding/current-date";\n', 1)

          anchor = '  const { phone, message, m, user, wroteThisTurn } = ctx;\n'
          block = '''\n  // Calendar facts are deterministic SAST state, not coaching.\n  if (isCurrentDateQuestion(message)) {\n    const reply = currentDateAnswer();\n    await logChat(user.id, message, reply, "CURRENT_DATE");\n    return reply;\n  }\n'''
          if 'CURRENT_DATE' not in s:
              assert anchor in s
              s = s.replace(anchor, anchor + block, 1)

          old = '  const isStepWeekQuery = /\\b(steps?\\s*(?:this\\s+)?week|my\\s+step\\s*(?:history|stats?|average|trend)|step\\s*(?:history|stats?|average|trend|report)|weekly\\s*steps?|7[\\s-]day\\s*steps?)\\b/i.test(m);'
          assert old in s
          new = old + '\n  const isNaturalStepFollowUp = /^(?:and|what about|how about)\\s+(?:the\\s+)?steps?\\s*\\?$/i.test(m.trim());'
          if 'isNaturalStepFollowUp' not in s:
              s = s.replace(old, new, 1)

          old_cond = '      /\\b(?:what(?:\'|’)??s|what is|what are|show me|tell me)\\b[^?]{0,24}\\bmy\\s+steps?\\b/i.test(m) ||\n      isStepWeekQuery) {'
          if old_cond not in s:
              old_cond = '      /\\b(?:what(?:\'|’)?s|what is|what are|show me|tell me)\\b[^?]{0,24}\\bmy\\s+steps?\\b/i.test(m) ||\n      isStepWeekQuery) {'
          assert old_cond in s
          new_cond = '      /\\b(?:what(?:\'|’)?s|what is|what are|show me|tell me)\\b[^?]{0,24}\\bmy\\s+steps?\\b/i.test(m) ||\n      isStepWeekQuery || isNaturalStepFollowUp) {'
          s = s.replace(old_cond, new_cond, 1)
          p.write_text(s)
      - name: Validate
        run: |
          npm run check
          npx tsx script/current-date-tests.ts
          npx tsx script/day-relative-situation-tests.ts
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'KamLife CTO Builder'
          git config user.email 'cto-builder@kamlife.local'
          git add server/handlers/misc-commands.ts
          git rm -f .github/workflows/cto-one-shot-fix.yml
          git commit -m 'Wire deterministic date and step follow-up owners'
          git push origin HEAD:${GITHUB_HEAD_REF}
