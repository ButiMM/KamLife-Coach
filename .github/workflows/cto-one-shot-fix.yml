name: CTO one-shot situation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Normalize canonical decision fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/handlers/gpt-block.ts')
          s = p.read_text()
          old = 'const decision = await canonicalDecision(user, message).catch(() => ({ todo: "", kind: "hold" }));'
          new = 'const decision = (await canonicalDecision(user, message).catch(() => ({ todo: "", kind: "hold", reply: "" }))) as { todo: string; kind: string; reply: string };'
          assert old in s, 'canonicalDecision fallback pattern not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          check = p.read_text()
          assert 'catch(() => ({ todo: "", kind: "hold", reply: "" }))' in check
      - name: Validate
        run: |
          npm run check
          npx tsx script/day-relative-situation-tests.ts
          git diff --check
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'KamLife CTO Builder'
          git config user.email 'cto-builder@kamlife.local'
          git add server/understanding/day-relative-situation.ts server/handlers/gpt-block.ts
          git rm -f .github/workflows/cto-one-shot-fix.yml
          git commit -m 'Validate Coach loop type boundary'
          git push origin HEAD:${GITHUB_HEAD_REF}
