<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1b33">
<title>KamLife · Your programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#0f1b33;--orange:#ff6a1a;--paper:#f6f1e9;--muted:#5d6676;--line:#e3ddd3;--green:#1fa855}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
header{background:var(--navy);color:#fff;padding:22px 20px}header div{max-width:640px;margin:0 auto}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em}.logo b{color:var(--orange)}
main{max-width:640px;margin:0 auto;padding:28px 20px 56px}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 26px}
.q{margin:0 0 20px}.q p{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin:0 0 8px}
[data-group]{display:flex;flex-wrap:wrap;gap:8px}
[data-group] button{font:600 15px Inter,sans-serif;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:11px 18px;cursor:pointer}
[data-group] button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
button:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.hint{color:var(--muted);font-size:14px;margin:24px 0 0}
.rules{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:28px 0 16px}.rules p{margin:0;font-size:14px;line-height:1.8}
.day{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin:0 0 14px}
.day h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:21px;margin:0 0 12px}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ex strong{font-size:15px}.sets{grid-column:1;font-size:13px;color:var(--muted)}
.watch{grid-column:2;grid-row:1 / span 2;font-size:13px;font-weight:600;color:var(--green);text-decoration:none;border:1.5px solid var(--green);border-radius:999px;padding:7px 12px;white-space:nowrap}
.walk{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-weight:600;font-size:14px}
.send{display:block;text-align:center;background:var(--green);color:#fff;font-weight:600;text-decoration:none;border-radius:999px;padding:16px 20px;margin:20px 0 0}
footer{max-width:640px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12px;line-height:1.7}
</style>
</head>
<body>
<header><div><span class="logo">Kam<b>Life</b></span></div></header>
<main>
<h1>Your programme</h1>
<p class="lead">Three taps. Then save this page: it's yours for the whole 90 days.</p>
<div class="q"><p>I am a</p><div data-group="who"><button type="button" value="w">Woman</button><button type="button" value="m">Man</button></div></div>
<div class="q"><p>I train</p><div data-group="where"><button type="button" value="gym">At the gym</button><button type="button" value="db">At home, dumbbells</button><button type="button" value="multi">At home, multi-gym</button><button type="button" value="none">At home, no equipment</button></div></div>
<div class="q"><p>Days a week</p><div data-group="days"><button type="button" value="2">2</button><button type="button" value="3">3</button><button type="button" value="4">4</button></div></div>
<div id="programme" aria-live="polite"></div>
</main>
<footer>KamLife is fitness coaching, not medical advice. If you have an injury or a health condition, check with your treating professional first, and stop if an exercise causes pain.</footer>
<script src="/plan/programmes.js"></script>
<script src="/plan/app.js"></script>
</body>
</html>
